name: Java and Docker CI

on:
  push:
    branches: [master, develop, release, 'release/**', 'feature/**']
  pull_request:
    branches: [master, develop, release, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run the executable JAR
        timeout-minutes: 1
        run: java -jar target/semcode.jar

      - name: Build the Docker image
        run: docker build --tag semcode:ci .

      # The current starter exits after printing a message and needs no database.
      - name: Run the application in Docker
        timeout-minutes: 1
        run: docker run --rm --network none semcode:ci

      - name: Save the executable JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semcode-jar
          path: target/semcode.jar
          if-no-files-found: error
          retention-days: 14
