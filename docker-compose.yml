version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: semcode-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: semuser
      MYSQL_PASSWORD: sempass

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./world-db/world.sql:/docker-entrypoint-initdb.d/world.sql

volumes:
  mysql_data: